name: AskTheAlert
options:
  bundleIdPrefix: com.askthealert
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.2"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: false

packages:
  RunAnywhere:
    url: https://github.com/RunanywhereAI/runanywhere-sdks
    from: "0.16.0"

targets:
  AskTheAlert:
    type: application
    platform: iOS
    sources:
      - path: AskTheAlert
        excludes:
          - "*.entitlements"
    resources:
      - path: AskTheAlert/Resources/tornado_guidance.json
    dependencies:
      - package: RunAnywhere
        product: RunAnywhere
      - package: RunAnywhere
        product: RunAnywhereLlamaCPP
      - package: RunAnywhere
        product: RunAnywhereONNX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.askthealert.app
        INFOPLIST_FILE: AskTheAlert/Info.plist
        CODE_SIGN_ENTITLEMENTS: AskTheAlert/AskTheAlert.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    entitlements:
      path: AskTheAlert/AskTheAlert.entitlements
